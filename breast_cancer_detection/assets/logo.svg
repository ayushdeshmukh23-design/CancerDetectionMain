  <rect x="90" y="20" width="500" height="460" rx="24" fill="url(#bgCard)"/>
  <circle cx="340" cy="195" r="116" fill="url(#circleBg)"/>
  <path d="M 258 202 C 258 165, 278 138, 299 126 C 314 117, 328 120, 340 131 C 352 120, 366 117, 381 126 C 402 138, 422 165, 422 202 C 422 240, 396 268, 340 283 C 284 268, 258 240, 258 202 Z" fill="url(#heatSpot)"/>
