      <stop offset="25%" stop-color="#FF4500" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#FF8C00" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#FFD700" stop-opacity="0.2"/>
